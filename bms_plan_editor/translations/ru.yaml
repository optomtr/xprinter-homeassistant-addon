configuration:
  plan_editor_secret:
    name: Ключ доступа ERP
    description: 32-256 символов без пробелов. Один и тот же секрет в редакторе и настройках ERP. Не используйте пароль пользователя.
  github_token:
    name: Доступ к репозиторию редактора
    description: Fine-grained GitHub token только для optomtr/bms-planspec с правом Contents Read-only. Не нужен доступ на запись.
  source_branch:
    name: Ветка или версия редактора
    description: Обычно main. Для фиксации версии можно указать тег из репозитория редактора.
  update_on_start:
    name: Проверять обновления при запуске
    description: При перезапуске загрузить и собрать новую версию. При ошибке запускается последняя рабочая версия. Первый запуск всегда требует загрузки.
network:
  4174/TCP: Редактор чертежей и защищённый API для ERP
