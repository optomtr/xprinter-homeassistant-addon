name: BMS Plan Editor
version: "1.0.0"
slug: bms_plan_editor
description: Building plans and electrical installation specifications for BMS ERP
url: https://github.com/optomtr/xprinter-homeassistant-addon
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
webui: http://[HOST]:[PORT:4174]/
ports:
  4174/tcp: 4174
ports_description:
  4174/tcp: Plan editor and signed BMS ERP API
options:
  plan_editor_secret: ""
  github_token: ""
  source_branch: main
  update_on_start: true
schema:
  plan_editor_secret: password
  github_token: password
  source_branch: str
  update_on_start: bool
